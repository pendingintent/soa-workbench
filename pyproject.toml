[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soa-builder"
version = "0.1.0"
description = "Schedule of Activities normalization, expansion, and validation utilities"
readme = "README.md"
requires-python = ">=3.11"
authors = [ { name = "Pending Intent" } ]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.0.0",
  "click>=8.1.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.23.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "jmespath>=1.1.0",
  "cdisc-library-client>=0.1.6",
  "mcp>=1.0.0,<2.0",
  "python-docx>=1.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.5.0,<0.16",
  "black>=24.0.0",
  "detect-secrets>=1.4.0",
  "httpx>=0.27.0"
]

[project.scripts]
soa-builder = "soa_builder.cli:main"
soa-builder-web = "soa_builder.web.app:main"
soa-mcp = "soa_builder.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff.lint]
# BLE001: no blind `except Exception` in the web app (plan Phase 6).
# Catch the specific errors, or use the named groups in web/errors.py.
extend-select = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Broad catches kept on purpose: audit recording must never break a
# request, startup preloads must never block boot, and the frozen legacy
# migrations swallow their own errors by design.
"src/soa_builder/web/audit.py" = ["BLE001"]
"src/soa_builder/web/lifespan.py" = ["BLE001"]
"src/soa_builder/web/db.py" = ["BLE001"]
"src/soa_builder/web/migrate_database.py" = ["BLE001"]
"src/soa_builder/web/migrations/legacy_*.py" = ["BLE001"]
# Not narrowed yet (outside the web app). List files explicitly: ruff
# globs let * match across directories.
"src/usdm/**" = ["BLE001"]
"src/soa_builder/__init__.py" = ["BLE001"]
"src/soa_builder/cli.py" = ["BLE001"]
"src/soa_builder/normalization.py" = ["BLE001"]
"src/soa_builder/schedule.py" = ["BLE001"]
"src/soa_builder/validation.py" = ["BLE001"]
