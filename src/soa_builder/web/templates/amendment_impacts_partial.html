<div id="impacts-section">
  <table class="fz-table">
    <tr class="fz-thead-row">
      <th>UID</th>
      <th>Type</th>
      <th>Description</th>
      <th class="am-td-center">Substantial</th>
      <th class="am-td-shrink">Save</th>
      <th class="am-td-shrink">Delete</th>
    </tr>
    {% for i in impacts %}
    <tr>
      <td class="fz-td-version"><span class="obj-uid">{{ i.impact_uid }}</span></td>
      <td>
        <select name="type_code" required class="am-select-compact">
          {% for code, sv in impact_terms.items()|sort(attribute='1') %}
          <option value="{{ code }}" {% if i.type_code == code %}selected{% endif %}>{{ sv }}</option>
          {% endfor %}
        </select>
      </td>
      <td><input name="text" value="{{ i.text }}" required class="am-input-compact" /></td>
      <td class="am-td-center">
        <input type="checkbox" name="is_substantial" value="1"
               {% if i.is_substantial %}checked{% endif %} />
      </td>
      <td class="am-td-shrink">
        <button type="button" class="am-btn am-btn-slate am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/impact/{{ i.id }}/update"
                hx-target="#impacts-section" hx-swap="outerHTML"
                hx-include="closest tr">Save</button>
      </td>
      <td class="am-td-shrink">
        <button type="button" class="am-btn am-btn-danger am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/impact/{{ i.id }}/delete"
                hx-target="#impacts-section" hx-swap="outerHTML"
                onclick="return confirm('Remove this impact?')">Delete</button>
      </td>
    </tr>
    {% else %}
    <tr class="fz-empty-row"><td colspan="6">No impacts added.</td></tr>
    {% endfor %}
  </table>

  <details class="am-add-change-panel am-mt-10">
    <summary class="am-add-change-summary">+ Add Impact</summary>
    <form hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/impacts/add"
          hx-target="#impacts-section" hx-swap="outerHTML"
          class="am-change-form-grid">
      <label>Type <span class="am-required">*</span></label>
      <select name="type_code" required class="am-select">
        <option value="" disabled selected>— select —</option>
        {% for code, sv in impact_terms.items()|sort(attribute='1') %}
        <option value="{{ code }}">{{ sv }}</option>
        {% endfor %}
      </select>
      <label class="am-label-top">Description <span class="am-required">*</span></label>
      <textarea name="text" required rows="3" class="am-textarea" placeholder="Impact description"></textarea>
      <label>Substantial?</label>
      <label class="am-label-normal">
        <input type="checkbox" name="is_substantial" value="1" /> Yes
      </label>
      <div class="am-form-actions">
        <button type="submit" class="am-btn am-btn-primary">Add Impact</button>
      </div>
    </form>
  </details>
</div>
