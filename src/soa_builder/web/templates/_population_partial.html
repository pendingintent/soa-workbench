<div id="study-population">
  <form hx-post="/ui/soa/{{ soa_id }}/population/planned_sex"
        hx-target="#study-population"
        hx-swap="outerHTML"
        class="am-grid-2">
    <div class="am-field am-field-span">
      <label class="am-field-label">Planned Sex <small class="am-color-subtle">(choose one or two)</small></label>
      <div class="am-flex-center-row" style="gap:16px;flex-wrap:wrap;">
        {% for opt in sex_options %}
        <label class="fz-amendment-toggle">
          <input type="checkbox" name="codes" value="{{ opt.code }}" {% if opt.code in planned_sex_codes %}checked{% endif %} />
          {{ opt.decode }} ({{ opt.code }})
        </label>
        {% endfor %}
      </div>
    </div>
    <div class="am-field-span am-flex-center-row" style="gap:8px;flex-wrap:wrap;">
      <button type="submit" class="am-btn am-btn-info">Save Planned Sex</button>
    </div>
  </form>
  <hr class="am-hr-divider" />
  <form hx-post="/ui/soa/{{ soa_id }}/population/planned_age"
        hx-target="#study-population"
        hx-swap="outerHTML"
        class="am-grid-2">
    <div class="am-field">
      <label class="am-field-label">Minimum Age</label>
      <input name="min_value" type="text" inputmode="decimal"
             value="{{ planned_age.min_value if planned_age.min_value is not none else ('n/a' if planned_age else '') }}"
             placeholder="e.g. 18, or n/a" class="am-input" />
    </div>
    <div class="am-field">
      <label class="am-field-label">Maximum Age</label>
      <input name="max_value" type="text" inputmode="decimal"
             value="{{ planned_age.max_value if planned_age.max_value is not none else ('n/a' if planned_age else '') }}"
             placeholder="e.g. 75, or n/a" class="am-input" />
    </div>
    <div class="am-field">
      <label class="am-field-label">Age Unit</label>
      <select name="unit_code" class="am-select">
        <option value="">-- Select unit --</option>
        {% for u in unit_options %}
        <option value="{{ u.code }}" {% if planned_age.unit_code == u.code %}selected{% endif %}>{{ u.decode }} ({{ u.code }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="am-field">
      <label class="am-field-label">Approximate</label>
      <label class="fz-amendment-toggle">
        <input type="checkbox" name="is_approximate" value="1" {% if planned_age.is_approximate %}checked{% endif %} />
        Ages are approximate?
      </label>
    </div>
    <div class="am-field-span am-flex-center-row" style="gap:8px;flex-wrap:wrap;">
      <button type="submit" class="am-btn am-btn-info">Save Planned Age</button>
      <small class="am-color-subtle">Leave a bound blank or enter n/a when the protocol does not set one (exported as null, per USDM v4.1).</small>
    </div>
  </form>
  {% if planned_age %}
  <form hx-post="/ui/soa/{{ soa_id }}/population/planned_age/delete"
        hx-target="#study-population"
        hx-swap="outerHTML"
        hx-confirm="Clear the planned age?"
        style="display:inline;">
    <button type="submit" class="am-btn am-btn-danger am-btn-sm">Clear Planned Age</button>
  </form>
  {% endif %}
  {% if error %}<p class="am-required">{{ error }}</p>{% endif %}
</div>
