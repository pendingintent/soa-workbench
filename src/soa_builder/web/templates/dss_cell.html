{# Partial for DSS assignment cell — one row per concept code with DSS dropdown #}
<td id="dss-cell-{{ activity_id }}" style="padding:4px;vertical-align:top;max-width:280px;">
  {% set dss_concepts = activity_concepts.get(activity_id, []) %}
  {% if dss_concepts %}
    {% for ac in dss_concepts %}
      <div style="display:flex;align-items:center;gap:4px;margin:2px 0;font-size:0.8em;">
        <span style="background:#e3f2fd;padding:1px 4px;border-radius:3px;white-space:nowrap;min-width:70px;text-align:center;display:inline-block;">{{ ac.code }}</span>
        <form hx-post="/ui/soa/{{ soa_id }}/activity/{{ activity_id }}/concept/{{ ac.code }}/dss"
              hx-target="#dss-cell-{{ activity_id }}"
              hx-swap="outerHTML"
              style="margin:0;display:flex;align-items:center;gap:4px;">
          <select name="dss_selection" onchange="this.form.requestSubmit()"
                  style="font-size:1.2em;max-width:160px;">
            <option value="">-- none --</option>
            {% for d in sdtm_specializations %}
              {% set dss_id = d.href.rstrip('/').split('/')|last %}
              <option value="{{ dss_id }}||{{ d.href }}"
                {% if ac.dss_title == dss_id %}selected{% endif %}>
                {{ d.title }}
              </option>
            {% endfor %}
          </select>
        </form>
      </div>
    {% endfor %}
  {% else %}
    <span style="color:#888;font-size:0.6em;">&ndash;</span>
  {% endif %}
</td>
