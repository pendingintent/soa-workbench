<div id="study-identifiers-section">
  {% if study_identifiers %}
  <ul style="list-style:none;margin:0 0 10px 0;padding:0;">
    {% for si in study_identifiers %}
    <li style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;
               background:var(--am-row-bg,#f8f8fa);border-radius:4px;
               padding:6px 8px;border:1px solid var(--am-border,#ddd);">
      <div style="flex:1;min-width:0;">
        <span class="obj-uid" style="margin-right:6px;">{{ si.study_identifier_uid }}</span>
        <span style="font-size:0.9em;color:var(--am-text);">{{ si.text }}</span>
        {% if si.org_name %}
        <span style="font-size:0.78em;color:var(--am-text-muted);margin-left:6px;">
          ({{ si.org_name }})
        </span>
        {% endif %}
      </div>
      <form hx-post="/ui/soa/{{ soa_id }}/study-identifiers/{{ si.id }}/delete"
            hx-target="#study-identifiers-section"
            hx-swap="outerHTML"
            style="flex-shrink:0;">
        <button type="submit"
                class="am-btn am-btn-danger am-btn-xs"
                title="Remove identifier">
          &times;
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% endif %}

  {% if not study_identifiers %}
  <form hx-post="/ui/soa/{{ soa_id }}/study-identifiers-add"
        hx-target="#study-identifiers-section"
        hx-swap="outerHTML"
        style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;">
    <div style="flex:2;min-width:160px;">
      <label class="am-field-label"
             style="display:block;font-size:0.8em;color:var(--am-text-muted);
                    margin-bottom:2px;">
        Text <span class="am-required">*</span>
      </label>
      <input name="text"
             class="am-input"
             placeholder="Identifier text (e.g. NCT12345678)"
             style="width:100%;box-sizing:border-box;" />
    </div>
    <div style="flex:1;min-width:160px;">
      <label class="am-field-label"
             style="display:block;font-size:0.8em;color:var(--am-text-muted);
                    margin-bottom:2px;">
        Organization
      </label>
      {% if orgs %}
      <select name="scope_org_uid"
              class="am-input"
              style="width:100%;box-sizing:border-box;">
        <option value="">— none —</option>
        {% for org in orgs %}
        <option value="{{ org.organization_uid }}">
          {{ org.name }}
        </option>
        {% endfor %}
      </select>
      {% else %}
      <select name="scope_org_uid"
              class="am-input"
              disabled
              style="width:100%;box-sizing:border-box;">
        <option value="">No organizations defined</option>
      </select>
      {% endif %}
    </div>
    <div style="flex-shrink:0;padding-bottom:1px;">
      <button type="submit"
              class="am-btn am-btn-info am-btn-sm">
        Add Identifier
      </button>
    </div>
  </form>
  {% endif %}
</div>
