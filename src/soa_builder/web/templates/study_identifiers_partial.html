<div id="study-identifiers-section">
  {% if study_identifiers %}
  <ul class="am-plain-list">
    {% for si in study_identifiers %}
    <li class="am-list-row">
      <div class="am-flex-1 am-minw-0">
        <span class="obj-uid am-mr-6">{{ si.study_identifier_uid }}</span>
        <span class="am-text am-fz-90">{{ si.text }}</span>
        {% if si.org_name %}
        <span class="am-text-muted am-fz-78 am-ml-6">
          ({{ si.org_name }})
        </span>
        {% endif %}
      </div>
      <form hx-post="/ui/soa/{{ soa_id }}/study-identifiers/{{ si.id }}/delete"
            hx-target="#study-identifiers-section"
            hx-swap="outerHTML"
            class="am-flex-shrink-0">
        <button type="submit"
                class="am-btn am-btn-danger am-btn-xs"
                title="Remove identifier">
          &times;
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% endif %}

  {% if not study_identifiers %}
  <form hx-post="/ui/soa/{{ soa_id }}/study-identifiers-add"
        hx-target="#study-identifiers-section"
        hx-swap="outerHTML"
        class="fz-form-row" style="gap:6px;">
    <div class="am-flex-2 am-minw-160">
      <label class="am-field-label am-field-label-inline">
        Text <span class="am-required">*</span>
      </label>
      <input name="text"
             class="am-input"
             placeholder="Identifier text (e.g. NCT12345678)" />
    </div>
    <div class="am-field-grow">
      <label class="am-field-label am-field-label-inline">
        Organization
      </label>
      {% if orgs %}
      <select name="scope_org_uid"
              class="am-input">
        <option value="">— none —</option>
        {% for org in orgs %}
        <option value="{{ org.organization_uid }}">
          {{ org.name }}
        </option>
        {% endfor %}
      </select>
      {% else %}
      <select name="scope_org_uid"
              class="am-input"
              disabled>
        <option value="">No organizations defined</option>
      </select>
      {% endif %}
    </div>
    <div class="am-flex-shrink-0 am-pb-1">
      <button type="submit"
              class="am-btn am-btn-info am-btn-sm">
        Add Identifier
      </button>
    </div>
  </form>
  {% endif %}
</div>
