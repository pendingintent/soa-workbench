<div id="organizations-section">
  <table class="fz-table">
    <tr class="fz-thead-row">
      <th>UID</th>
      <th>Name</th>
      <th>Label</th>
      <th>Type</th>
      <th>ID Scheme</th>
      <th>Identifier</th>
      <th>City</th>
      <th>State</th>
      <th>Postal</th>
      <th>Country</th>
      <th></th>
    </tr>
    {% for o in organizations %}
    <tr>
      <td class="fz-td-version"><span class="obj-uid">{{ o.organization_uid }}</span></td>
      <td>
        <input name="name" value="{{ o.name }}" required
               class="am-input-compact am-w-120" />
      </td>
      <td>
        <input name="label" value="{{ o.label or '' }}" placeholder="Label"
               class="am-input-compact am-w-80" />
      </td>
      <td>
        <select name="type_code" class="am-select-compact"
                onchange="syncOrgTypeDecode(this)">
          <option value="">— none —</option>
          {% for opt in org_type_options %}
          <option value="{{ opt.code }}" data-decode="{{ opt.label | e }}"
            {% if opt.code == o.type_code_value %}selected{% endif %}>
            {{ opt.label }}
          </option>
          {% endfor %}
        </select>
        <input type="hidden" name="type_decode"
               value="{{ o.type_decode or '' }}" />
      </td>
      <td>
        <input name="identifier_scheme" value="{{ o.identifier_scheme or '' }}"
               placeholder="Scheme" class="am-input-compact am-w-55" />
      </td>
      <td>
        <input name="identifier" value="{{ o.identifier or '' }}"
               placeholder="ID" class="am-input-compact am-w-80" />
      </td>
      <td>
        <input name="addr_city" value="{{ o.addr_city or '' }}"
               placeholder="City" class="am-input-compact am-w-80" />
      </td>
      <td>
        <input name="addr_state" value="{{ o.addr_state or '' }}"
               placeholder="State" class="am-input-compact am-w-55" />
      </td>
      <td>
        <input name="addr_postal_code" value="{{ o.addr_postal_code or '' }}"
               placeholder="ZIP" class="am-input-compact am-w-55" />
      </td>
      <td>
        <select name="addr_country_numeric" class="am-select-compact"
                onchange="syncOrgCountryName(this)">
          <option value="">— none —</option>
          {% for c in countries_options %}
          <option value="{{ c.code }}" data-name="{{ c.name | e }}"
            {% if c.code == o.country_numeric %}selected{% endif %}>
            {{ c.name }}
          </option>
          {% endfor %}
        </select>
        <input type="hidden" name="addr_country_name"
               value="{{ o.country_decode or '' }}" />
      </td>
      <td class="am-td-center am-nowrap">
        <button type="button" class="am-btn am-btn-slate am-btn-xs"
                hx-post="/ui/soa/{{ soa_id }}/organizations/{{ o.id }}/update"
                hx-target="#organizations-section"
                hx-swap="outerHTML"
                hx-include="closest tr">Save</button>
        <form hx-post="/ui/soa/{{ soa_id }}/organizations/{{ o.id }}/delete"
              hx-target="#organizations-section"
              hx-swap="outerHTML"
              class="am-inline-form">
          <button type="submit" class="am-btn am-btn-danger am-btn-xs">&times;</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr class="fz-empty-row"><td colspan="11">No organizations yet.</td></tr>
    {% endfor %}
  </table>

  <hr class="am-subsection-divider" />

  <form hx-post="/ui/soa/{{ soa_id }}/organizations-add"
        hx-target="#organizations-section"
        hx-swap="outerHTML"
        class="am-grid-2">

    <div class="am-field">
      <label class="am-field-label">Name <span class="am-required">*</span></label>
      <input name="name" required class="am-input" placeholder="Organization name" />
    </div>

    <div class="am-field">
      <label class="am-field-label">Label</label>
      <input name="label" class="am-input" placeholder="Short label (optional)" />
    </div>

    <div class="am-field">
      <label class="am-field-label">Identifier Scheme</label>
      <input name="identifier_scheme" class="am-input" placeholder="e.g. DUNS, ROR" />
    </div>

    <div class="am-field">
      <label class="am-field-label">Identifier</label>
      <input name="identifier" class="am-input" placeholder="Identifier value" />
    </div>

    <div class="am-field am-field-span">
      <label class="am-field-label">Type</label>
      <select name="type_code" class="am-select"
              onchange="updateOrgTypeDecode(this, 'org-type-decode-{{ soa_id }}')">
        <option value="">— select type —</option>
        {% for opt in org_type_options %}
        <option value="{{ opt.code }}" data-decode="{{ opt.label | e }}">{{ opt.label }}</option>
        {% endfor %}
      </select>
      <input type="hidden" name="type_decode" id="org-type-decode-{{ soa_id }}" value="" />
    </div>

    <div class="am-field am-field-span am-mt-6">
      <span class="am-form-subheading">
        Legal Address
      </span>
    </div>

    <div class="am-field am-field-span">
      <label class="am-field-label">Address Text</label>
      <textarea name="addr_text" rows="2" class="am-textarea"
                placeholder="Full address as single text (optional)"></textarea>
    </div>

    <div class="am-field am-field-span">
      <label class="am-field-label">Address Lines</label>
      <textarea name="addr_lines" rows="2" class="am-textarea"
                placeholder="One address line per row (optional)"></textarea>
    </div>

    <div class="am-field">
      <label class="am-field-label">City</label>
      <input name="addr_city" class="am-input" placeholder="City" />
    </div>

    <div class="am-field">
      <label class="am-field-label">District</label>
      <input name="addr_district" class="am-input" placeholder="District / County" />
    </div>

    <div class="am-field">
      <label class="am-field-label">State / Province</label>
      <input name="addr_state" class="am-input" placeholder="State or Province" />
    </div>

    <div class="am-field">
      <label class="am-field-label">Postal Code</label>
      <input name="addr_postal_code" class="am-input" placeholder="Postal / ZIP code" />
    </div>

    <div class="am-field am-field-span">
      <label class="am-field-label">Country</label>
      <select name="addr_country_numeric" class="am-select"
              onchange="updateOrgCountryName(this, 'org-country-name-{{ soa_id }}')">
        <option value="">— select country —</option>
        {% for c in countries_options %}
        <option value="{{ c.code }}" data-name="{{ c.name | e }}">{{ c.name }}</option>
        {% endfor %}
      </select>
      <input type="hidden" name="addr_country_name"
             id="org-country-name-{{ soa_id }}" value="" />
    </div>

    <div class="am-field-span am-flex-center-row" style="gap:8px;">
      <button type="submit" class="am-btn am-btn-info am-btn-sm">
        Add Organization
      </button>
    </div>
  </form>
</div>

<script>
function updateOrgTypeDecode(sel, targetId) {
  var opt = sel.options[sel.selectedIndex];
  document.getElementById(targetId).value = opt.dataset.decode || '';
}
function updateOrgCountryName(sel, targetId) {
  var opt = sel.options[sel.selectedIndex];
  document.getElementById(targetId).value = opt.dataset.name || '';
}
/* Inline-row variants: update the adjacent hidden input */
function syncOrgTypeDecode(sel) {
  var opt = sel.options[sel.selectedIndex];
  var hidden = sel.parentElement.querySelector('input[name="type_decode"]');
  if (hidden) hidden.value = opt.dataset.decode || '';
}
function syncOrgCountryName(sel) {
  var opt = sel.options[sel.selectedIndex];
  var hidden = sel.parentElement.querySelector('input[name="addr_country_name"]');
  if (hidden) hidden.value = opt.dataset.name || '';
}
</script>
