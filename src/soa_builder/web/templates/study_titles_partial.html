<div id="study-titles-section">
  {% if study_titles %}
  <ul class="am-plain-list">
    {% for t in study_titles %}
    <li class="am-list-row">
      <div class="am-flex-1 am-minw-0">
        <span class="am-text am-fz-90">{{ t.text }}</span>
        {% if t.type_decode %}
        <span class="am-text-muted am-fz-78 am-ml-6">
          ({{ t.type_decode }})
        </span>
        {% endif %}
      </div>
      <form hx-post="/ui/soa/{{ soa_id }}/titles/{{ t.id }}/delete"
            hx-target="#study-titles-section"
            hx-swap="outerHTML"
            class="am-flex-shrink-0">
        <button type="submit"
                class="am-btn am-btn-danger am-btn-xs"
                title="Remove title">
          &times;
        </button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% endif %}

  <form hx-post="/ui/soa/{{ soa_id }}/titles-add"
        hx-target="#study-titles-section"
        hx-swap="outerHTML"
        class="fz-form-row" style="gap:6px;">
    <div class="am-flex-2 am-minw-160">
      <label class="am-field-label-inline">Text</label>
      <input name="text"
             class="am-input"
             placeholder="Study title text" />
    </div>
    <div class="am-flex-1 am-minw-140">
      <label class="am-field-label-inline">Type</label>
      <select name="type_code"
              id="title-type-select-{{ soa_id }}"
              class="am-input"
              onchange="updateTitleDecode(this, 'title-decode-{{ soa_id }}')">
        <option value="">— select type —</option>
        {% for opt in title_type_options %}
        <option value="{{ opt.code }}" data-decode="{{ opt.label | e }}">
          {{ opt.label }}
        </option>
        {% endfor %}
      </select>
      <input type="hidden"
             name="type_decode"
             id="title-decode-{{ soa_id }}"
             value="" />
    </div>
    <div class="am-flex-shrink-0 am-pb-1">
      <button type="submit"
              class="am-btn am-btn-info am-btn-sm">
        Add Title
      </button>
    </div>
  </form>
</div>

<script>
  function updateTitleDecode(selectEl, decodeId) {
    var selected = selectEl.options[selectEl.selectedIndex];
    var decodeVal = selected ? (selected.getAttribute('data-decode') || '') : '';
    var decodeInput = document.getElementById(decodeId);
    if (decodeInput) decodeInput.value = decodeVal;
  }
</script>
