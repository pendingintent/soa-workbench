<div id="geo-scopes-section">
  <table class="fz-table">
    <tr class="fz-thead-row">
      <th>UID</th>
      <th>Type</th>
      <th style="width:1%;white-space:nowrap;">Save</th>
      <th style="width:1%;white-space:nowrap;">Delete</th>
    </tr>
    {% for s in geo_scopes %}
    <tr>
      <td class="fz-td-version"><span class="obj-uid">{{ s.scope_uid }}</span></td>
      <td>
        <select name="type_code" required class="am-select-compact">
          {% for code, sv in geo_scope_type_terms.items()|sort(attribute='1') %}
          <option value="{{ code }}" {% if s.type_code == code %}selected{% endif %}>{{ sv }}</option>
          {% endfor %}
        </select>
      </td>
      <td style="width:1%;white-space:nowrap;">
        <button type="button" class="am-btn am-btn-slate am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/geographic-scope/{{ s.id }}/update"
                hx-target="#geo-scopes-section" hx-swap="outerHTML"
                hx-include="closest tr">Save</button>
      </td>
      <td style="width:1%;white-space:nowrap;">
        <button type="button" class="am-btn am-btn-danger am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/geographic-scope/{{ s.id }}/delete"
                hx-target="#geo-scopes-section" hx-swap="outerHTML"
                onclick="return confirm('Remove this geographic scope?')">Delete</button>
      </td>
    </tr>
    {% else %}
    <tr class="fz-empty-row"><td colspan="4">No geographic scopes added.</td></tr>
    {% endfor %}
  </table>

  <details class="am-add-change-panel" style="margin-top:10px;">
    <summary class="am-add-change-summary">+ Add Geographic Scope</summary>
    <form hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/geographic-scopes/add"
          hx-target="#geo-scopes-section" hx-swap="outerHTML"
          class="am-change-form-grid">
      <label>Type <span class="am-required">*</span></label>
      <select name="type_code" required class="am-select">
        <option value="" disabled selected>— select —</option>
        {% for code, sv in geo_scope_type_terms.items()|sort(attribute='1') %}
        <option value="{{ code }}">{{ sv }}</option>
        {% endfor %}
      </select>
      <div class="am-form-actions">
        <button type="submit" class="am-btn am-btn-primary">Add Scope</button>
      </div>
    </form>
  </details>
</div>
