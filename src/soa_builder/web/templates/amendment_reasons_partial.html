<div id="reasons-section">
  <table class="fz-table">
    <tr class="fz-thead-row">
      <th>UID</th>
      <th>Role</th>
      <th>Reason</th>
      <th>Other Reason</th>
      <th style="width:1%;white-space:nowrap;">Save</th>
      <th style="width:1%;white-space:nowrap;">Delete</th>
    </tr>
    {% if primary_reason %}
    <tr>
      <td class="fz-td-version"><span class="obj-uid">{{ primary_reason.reason_uid }}</span></td>
      <td><span class="am-substantial-yes" style="font-size:0.78em;">Primary</span></td>
      <td>
        <select name="code" required class="am-select-compact">
          {% for code, sv in reason_terms.items()|sort(attribute='1') %}
          <option value="{{ code }}" {% if primary_reason.code == code %}selected{% endif %}>{{ sv }}</option>
          {% endfor %}
        </select>
      </td>
      <td>
        <input name="other_reason" value="{{ primary_reason.other_reason or '' }}"
               class="am-input-compact" placeholder="Required if Other" />
      </td>
      <td style="width:1%;white-space:nowrap;">
        <button type="button" class="am-btn am-btn-slate am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/reason/{{ primary_reason.id }}/update"
                hx-target="#reasons-section" hx-swap="outerHTML"
                hx-include="closest tr">Save</button>
      </td>
      <td style="width:1%;white-space:nowrap;"></td>
    </tr>
    {% endif %}
    {% for r in secondary_reasons %}
    <tr>
      <td class="fz-td-version"><span class="obj-uid">{{ r.reason_uid }}</span></td>
      <td><span class="am-substantial-no" style="font-size:0.78em;">Secondary</span></td>
      <td>
        <select name="code" required class="am-select-compact">
          {% for code, sv in reason_terms.items()|sort(attribute='1') %}
          <option value="{{ code }}" {% if r.code == code %}selected{% endif %}>{{ sv }}</option>
          {% endfor %}
        </select>
      </td>
      <td>
        <input name="other_reason" value="{{ r.other_reason or '' }}"
               class="am-input-compact" placeholder="Required if Other" />
      </td>
      <td style="width:1%;white-space:nowrap;">
        <button type="button" class="am-btn am-btn-slate am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/reason/{{ r.id }}/update"
                hx-target="#reasons-section" hx-swap="outerHTML"
                hx-include="closest tr">Save</button>
      </td>
      <td style="width:1%;white-space:nowrap;">
        <button type="button" class="am-btn am-btn-danger am-btn-sm"
                hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/reason/{{ r.id }}/delete"
                hx-target="#reasons-section" hx-swap="outerHTML"
                onclick="return confirm('Remove this reason?')">Delete</button>
      </td>
    </tr>
    {% else %}
    {% if not primary_reason %}
    <tr class="fz-empty-row"><td colspan="6">No reasons added.</td></tr>
    {% endif %}
    {% endfor %}
  </table>

  <details class="am-add-change-panel" style="margin-top:10px;">
    <summary class="am-add-change-summary">+ Add Secondary Reason</summary>
    <form hx-post="/ui/soa/{{ soa_id }}/amendment/{{ amendment.id }}/reasons/add"
          hx-target="#reasons-section" hx-swap="outerHTML"
          class="am-change-form-grid">
      <label>Reason <span class="am-required">*</span></label>
      <select name="code" required class="am-select">
        <option value="" disabled selected>— select reason —</option>
        {% for code, sv in reason_terms.items()|sort(attribute='1') %}
        <option value="{{ code }}">{{ sv }}</option>
        {% endfor %}
      </select>
      <label>Other Reason</label>
      <input name="other_reason" class="am-input" placeholder="Required if Other" />
      <div class="am-form-actions">
        <button type="submit" class="am-btn am-btn-primary">Add Reason</button>
      </div>
    </form>
  </details>
</div>
