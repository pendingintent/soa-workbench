{% extends 'base.html' %}
{% block content %}
<h2>Generate Trial Design Domains (SDTM)</h2>

<div class="am-mb-12">
  <a href="/ui/soa/{{ soa_id }}/edit" class="am-back-link">&larr; Return to Edit Page</a>
</div>

<hr class="fz-section-divider" />

<table class="fz-table am-maxw-640">
  <tr class="fz-thead-row">
    <th>Domain</th>
    <th class="am-td-center">JSON</th>
    <th class="am-td-center">CSV</th>
    <th class="am-td-center">View</th>
  </tr>
  {% for key, label, json_file, csv_file in domains %}
  <tr>
    <td>{{ label }}</td>
    <td class="am-td-center">
      <a href="/soa/{{ soa_id }}/tdd/{{ key }}/json" class="am-btn am-btn-info am-btn-sm">
        Download JSON
      </a>
    </td>
    <td class="am-td-center">
      <a href="/soa/{{ soa_id }}/tdd/{{ key }}/csv" class="am-btn am-btn-success am-btn-sm">
        Download CSV
      </a>
    </td>
    <td class="am-td-center">
      <button class="am-btn am-btn-slate am-btn-sm"
              hx-get="/ui/soa/{{ soa_id }}/tdd/{{ key }}/view"
              hx-target="#tdd-preview"
              hx-swap="outerHTML">
        View
      </button>
    </td>
  </tr>
  {% endfor %}
</table>

<div id="tdd-preview"></div>

{% endblock %}
