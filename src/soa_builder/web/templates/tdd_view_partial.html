<div id="tdd-preview" class="am-mt-20">
  <div class="am-flex-center-row am-mb-8" style="gap:12px;">
    <h3 class="am-m-0 am-text am-fz-100">
      {{ domain }} &mdash; {{ rows|length }} record(s)
    </h3>
    <button onclick="document.getElementById('tdd-preview').outerHTML='<div id=\'tdd-preview\'></div>'"
            class="am-btn am-btn-slate am-btn-xs am-ml-auto">
      Close
    </button>
  </div>
  {% if rows %}
  <div class="am-overflow-x-auto">
    <table class="am-data-table am-fz-78 am-w-full">
      <thead>
        <tr>
          {% for col in fieldnames %}
          <th class="am-nowrap">{{ col }}</th>
          {% endfor %}
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          {% for col in fieldnames %}
          <td>{{ row.get(col, '') }}</td>
          {% endfor %}
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="am-empty-note-italic">
    No records generated for this domain.
  </p>
  {% endif %}
</div>
