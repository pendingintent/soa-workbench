{% extends 'base.html' %}
{% block content %}
<h2>Schedule Timelines for SoA {{ soa_id }}</h2>

<div style="margin-bottom:2px;">
    <form method="post" action="/ui/soa/{{ soa_id }}/schedule_timelines/create" style="display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;">
        <div style="display: flex;flex-direction: column;gap: 2px;">
            <label>Name *</label>
            <input name="name" placeholder="Schedule Timeline Name" required />
        </div>
        <div style="display: flex;flex-direction: column;gap:2px;">
            <label>Label</label>
            <input name="label" placeholder="Label (optional)" />
        </div>
        <div style="display: flex;flex-direction: column;gap:2px;">
            <label>Description</label>
            <input name="description" placeholder="Description (Optional)" />
        </div>
        <div style="display: flex;flex-direction: column;gap:2px;">
            <label>Main Timeline</label>
            <input name="main_timeline" placeholder="Main Timeline (Optional)" />
        </div>
        <div style="display: flex;flex-direction: column;gap:2px;">
            <label>Entry Condition</label>
            <input name="entry_condition" placeholder="Entry Condition (Optional)" />
        </div>
        <div style="display: flex;flex-direction: column;gap:2px;">
            <label>Entry ID</label>
            <input name="entry_id" placeholder="Entry ID (Optional)" />
        </div>
        <div style="display: flex;flex-direction: column;gap:2px;">
            <label>Exit ID</label>
            <input name="exit_id" placeholder="Exit ID (Optional)" />
        </div>
        <button style="background:#1976d2;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;">Add Schedule Timeline</button>
    </form>
</div>


<table style="width:100%;font-size:0.85em;border-collapse:collapse;">
    <tr style="background:#eee;">
        <th style="text-align:left;padding:4px;">UID</th>
        <th style="text-align:left;padding:4px;">Name</th>
        <th style="text-align:left;padding:4px;">Label</th>
        <th style="text-align:left;padding:4px;">Description</th>
        <th style="text-align:left;padding:4px;">Main Timeline</th>
        <th style="text-align:left;padding:4px;">Entry Condition</th>
        <th style="text-align:left;padding:4px;">Entry ID</th>
        <th style="text-align:left;padding:4px;">Exit ID</th>
        <th style="text-align:left;padding:4px;">Save</th>
        <th style="text-align:left;padding:4px;">Delete</th>
    </tr>
    {% for st in schedule_timelines %}
    <tr>
        <form method="post" action="/ui/soa/{{ soa_id }}/schedule_timelines/{{ st.id }}/update">
            <td style="padding:4px;white-space:nowrap;">{{ st.schedule_timeline_id }}</td>
            <td style="padding:4px;"><input name="name" value="{{ st.name }}" required /></td>
            <td style="padding:4px;"><input name="label" value="{{ st.label or '' }}" placeholder="Label" /></td>
            <td style="padding:4px;"><input name="description" value="{{ st.description or '' }}" placeholder="Description" /></td>
            <td style="padding:4px;"><input name="main_timeline" value="{{ st.main_timeline }}" /></td>
            <td style="padding:4px;"><input name="entry_condition" value="{{ st.entry_condition or ''}}" placeholder="Entry Condition" /></td>
            <td style="padding:4px;"><input name="entry_id" value="{{ st.entry_id or '' }}" placeholder="Entry ID" /></td>
            <td style="padding:4px;"><input name="exit_id" value="{{ st.exit_id or '' }}" placeholder="Exit ID" /></td>
            <td style="padding:4px;">
                <button style="background:#607d8b;color:#fff;border:none;padding:2px 6px;border-radius:3px;cursor:pointer;">Save</button>
            </td>
        </form>
        <td style="padding:4px;">
            <form method="post" action="/ui/soa/{{ soa_id }}/schedule_timelines/{{ st.id }}/delete">
                <button style="background:#c62828;color:#fff;border:none;padding:2px 6px;border-radius:3px;cursor:pointer;">✕</button>
            </form>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="12" style="padding:6px;color:#777;">No instances yet.</td>
    </tr>
    {% endfor %}
</table>


{% endblock %}
