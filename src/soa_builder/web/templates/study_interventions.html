{% extends 'base.html' %}
{% block content %}

<h2 class="am-page-title">Study Interventions</h2>
{% if study_label %}
<p class="am-text-mid am-mb-8">{{ study_label }}</p>
{% endif %}

<div class="am-mb-12">
  <a href="/ui/soa/{{ soa_id }}/edit" class="am-back-link">&larr; Return to Edit Page</a>
</div>

<hr class="fz-section-divider" />

<div class="study-meta-card">
  <h3>Add Study Intervention</h3>
  <form hx-post="/ui/soa/{{ soa_id }}/study-interventions-add"
        hx-target="#interventions-container"
        hx-swap="outerHTML"
        hx-on::after-request="this.reset()"
        class="am-grid-2">

    <div class="am-field">
      <label class="am-field-label">Name <span class="am-required">*</span></label>
      <input name="name" required class="am-input" placeholder="Intervention name" />
    </div>

    <div class="am-field">
      <label class="am-field-label">Label</label>
      <input name="label" class="am-input" placeholder="Short label (optional)" />
    </div>

    <div class="am-field am-field-span">
      <label class="am-field-label">Description</label>
      <textarea name="description" rows="2" class="am-textarea"
                placeholder="Description (optional)"></textarea>
    </div>

    <div class="am-field">
      <label class="am-field-label">Role</label>
      <select name="role_code" class="am-select"
              onchange="syncDecode(this,'si-role-decode')">
        <option value="">— select role —</option>
        {% for opt in role_options %}
        <option value="{{ opt.code }}" data-decode="{{ opt.label | e }}">{{ opt.label }}</option>
        {% endfor %}
      </select>
      <input type="hidden" name="role_decode" id="si-role-decode" value="" />
    </div>

    <div class="am-field">
      <label class="am-field-label">Type</label>
      <select name="type_code" class="am-select"
              onchange="syncDecode(this,'si-type-decode')">
        <option value="">— select type —</option>
        {% for opt in type_options %}
        <option value="{{ opt.code }}" data-decode="{{ opt.label | e }}">{{ opt.label }}</option>
        {% endfor %}
      </select>
      <input type="hidden" name="type_decode" id="si-type-decode" value="" />
    </div>

    <div class="am-field am-field-span">
      <label class="am-field-label">Minimum Response Duration</label>
      <div class="am-flex-center-row am-flex-wrap" style="gap:8px;">
        <input name="mrd_value" type="number" step="any" min="0"
               class="am-input am-maxw-120" placeholder="Value" />
        <select name="mrd_unit_code" class="am-select am-flex-1 am-minw-180"
                onchange="syncDecode(this,'si-mrd-unit-decode')">
          <option value="">— select unit —</option>
          {% for opt in unit_options %}
          <option value="{{ opt.code }}" data-decode="{{ opt.label | e }}">{{ opt.label }}</option>
          {% endfor %}
        </select>
        <input type="hidden" name="mrd_unit_decode" id="si-mrd-unit-decode" value="" />
      </div>
    </div>

    <div class="am-field-span am-flex-center-row" style="gap:8px;">
      <button type="submit" class="am-btn am-btn-info">Add Intervention</button>
    </div>

  </form>
</div>

<h3 class="fz-section-heading">Study Interventions ({{ interventions|length }})</h3>

{% include "study_interventions_partial.html" %}

<script>
function syncDecode(sel, targetId) {
  var opt = sel.options[sel.selectedIndex];
  document.getElementById(targetId).value = opt.dataset.decode || '';
}
</script>

{% endblock %}
