<ul id="transition-rule-list">
  {% for rule in transition_rules %}
  <li class="rule-item" data-id="{{ rule.transition_rule_uid }}" title="{{ rule.name or '' }}">
    <span class="ord">{{ rule.order_index }}</span>. <strong>{% if rule.label %}{{ rule.label }}{% else %}{{ rule.name }}{% endif %}</strong>
    <span class="transition-rule-actions">
      <form hx-post="/ui/soa/{{ soa_id }}/update_transition_rule" hx-target="#transition-rule-list" hx-swap="outerHTML" class="am-inline-rule-form">
        <input type="hidden" name="transition_rule_uid" value="{{ rule.transition_rule_uid }}" />
        <input name="name" value="{{ rule.name }}" placeholder="Name" class="am-w-90" />
        <input name="label" value="{{ rule.label or '' }}" placeholder="Label" class="am-w-80" />
        <input name="description" value="{{ rule.description or '' }}" placeholder="Desc" class="am-w-120" />
        <input name="text" value="{{ rule.text or '' }}" placeholder="Rule text" class="am-w-160" />
        <button class="am-btn-legacy-slate">Save</button>
      </form>
      <form hx-post="/ui/soa/{{ soa_id }}/delete_transition_rule" hx-target="#transition-rule-list" hx-swap="outerHTML" hx-confirm="Delete transition rule '{{ rule.name }}'?" class="am-inline-form">
        <input type="hidden" name="transition_rule_uid" value="{{ rule.transition_rule_uid }}" />
        <button class="am-btn-legacy-danger">
          Delete
        </button>
      </form>
    </span>
  </li>
  {% endfor %}
</ul>
